<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
        width: 260px;
        background: #1e1e1e;
        color: white;
        padding: 20px;
        overflow-y: auto;
    }

    #sidebar h2 {
        margin-top: 0;
        font-size: 20px;
        margin-bottom: 15px;
    }

    #search {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: none;
        margin-bottom: 15px;
    }

    .page-btn {
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        background: #333;
        color: white;
        border: none;
        border-radius: 6px;
        text-align: left;
        cursor: pointer;
        transition: 0.2s;
    }

    .page-btn:hover {
        background: #444;
    }

    /* MAIN AREA */
    #main {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    #topbar {
        background: white;
        padding: 12px 20px;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #editor {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #ffffff;
    }

    #editor[contenteditable="true"] {
        outline: 2px solid #0081f2;
        background: #f0f8ff;
    }

    #saveBtn {
        padding: 8px 14px;
        background: #0081f2;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    #saveBtn:hover {
        background: #0a6fcc;
    }
</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <h2>Admin Pages</h2>

    <input id="search" type="text" placeholder="Search pages...">

    <div id="pageList">
        <button class="page-btn">Ace Casino</button>
        <button class="page-btn">American Luck</button>
        <button class="page-btn">Baba Casino</button>
        <button class="page-btn">BangCoins</button>
        <button class="page-btn">FireSevens</button>
        <button class="page-btn">Moozi</button>
        <button class="page-btn">Cashoomo</button>
        <button class="page-btn">CoinsBack</button>
        <button class="page-btn">Slot Games</button>
        <button class="page-btn">Poker Site 1</button>
        <button class="page-btn">Poker Site 2</button>
    </div>
</div>

<!-- MAIN AREA -->
<div id="main">

    <div id="topbar">
        <strong id="currentPage">Select a page</strong>
        <button id="saveBtn">Save Changes</button>
    </div>

    <div id="editor">
        <p>Select a page from the left to begin editing.</p>
    </div>

</div>

<script>
    const editor = document.getElementById("editor");
    const currentPage = document.getElementById("currentPage");
    const search = document.getElementById("search");
    const pageButtons = document.querySelectorAll(".page-btn");

    // Fake page content (you can replace with real HTML later)
    const pageData = {
        "Ace Casino": "<h1>Ace Casino</h1><p>Welcome to Ace Casino.</p>",
        "American Luck": "<h1>American Luck</h1><p>USA themed casino.</p>",
        "Baba Casino": "<h1>Baba Casino</h1><p>Fun and exciting games.</p>",
        "BangCoins": "<h1>BangCoins</h1><p>Crypto casino platform.</p>",
        "FireSevens": "<h1>FireSevens</h1><p>Hot slots and jackpots.</p>",
        "Moozi": "<h1>Moozi</h1><p>Coming soon...</p>",
        "Cashoomo": "<h1>Cashoomo</h1><p>Cashback rewards casino.</p>",
        "CoinsBack": "<h1>CoinsBack</h1><p>Earn coins on every bet.</p>",
        "Slot Games": "<h1>Slot Games</h1><p>All slot machines listed here.</p>",
        "Poker Site 1": "<h1>Poker Site 1</h1><p>Texas Hold'em tables.</p>",
        "Poker Site 2": "<h1>Poker Site 2</h1><p>High stakes poker.</p>"
    };

    // Load page into editor
    pageButtons.forEach(btn => {
        btn.addEventListener("click", () => {
            const name = btn.textContent.trim();
            currentPage.textContent = name;
            editor.innerHTML = pageData[name] || "<p>No content.</p>";
            editor.setAttribute("contenteditable", "true");
        });
    });

    // Search filter
    search.addEventListener("input", () => {
        const term = search.value.toLowerCase();
        pageButtons.forEach(btn => {
            btn.style.display = btn.textContent.toLowerCase().includes(term)
                ? "block"
                : "none";
        });
    });

    // Save button (local only)
    document.getElementById("saveBtn").addEventListener("click", () => {
        alert("Changes saved locally. (You can wire this to your backend later.)");
    });
</script>

</body>
</html>
