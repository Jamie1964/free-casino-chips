<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
        width: 260px;
        background: #1e1e1e;
        color: white;
        padding: 20px;
        overflow-y: auto;
    }

    #sidebar h2 {
        margin-top: 0;
        font-size: 20px;
        margin-bottom: 15px;
    }

    /* MAIN AREA */
    #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }

    #topbar {
        background: white;
        padding: 12px 20px;
        border-bottom: 1px solid #ddd;
    }

    #content {
        padding: 20px;
    }

    .card {
        background: white;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px #00000022;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #fafafa;
    }

    .highlight {
        font-weight: bold;
        color: #0081f2;
    }
</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <h2>Admin Dashboard</h2>
    <p>Visitor analytics for all pages.</p>
</div>

<!-- MAIN AREA -->
<div id="main">

    <div id="topbar">
        <strong>Site Analytics Overview</strong>
    </div>

    <div id="content">

        <div class="card">
            <h3>Total Visitors</h3>
            <p id="totalVisitors" class="highlight">0</p>
        </div>

        <div class="card">
            <h3>Total Page Views</h3>
            <p id="totalViews" class="highlight">0</p>
        </div>

        <div class="card">
            <h3>Top 10 Pages</h3>
            <table id="topPagesTable">
                <tr><th>Page</th><th>Views</th></tr>
            </table>
        </div>

        <div class="card">
            <h3>All Pages</h3>
            <table id="allPagesTable">
                <tr><th>Page</th><th>Views</th></tr>
            </table>
        </div>

    </div>

</div>

<script>
    // Your pages in the root
    const pages = [
        "ace.html",
        "americanluck.html",
        "babacasino.html",
        "bangcoins.html",
        "firesevens.html",
        "moozi.html",
        "cashoomo.html",
        "coinsback.html",
        "slotgames.html",
        "poker1.html",
        "poker2.html"
    ];

    function getPageName(filename) {
        return filename.replace(".html", "")
                       .replace(/-/g, " ")
                       .replace(/\b\w/g, c => c.toUpperCase());
    }

    function loadAnalytics() {
        let allData = [];
        let totalViews = 0;

        pages.forEach(page => {
            const key = "views_" + page; // matches your localStorage system
            const count = parseInt(localStorage.getItem(key) || "0");

            allData.push({ page, count });
            totalViews += count;
        });

        // Sort for top pages
        const topPages = [...allData].sort((a, b) => b.count - a.count).slice(0, 10);

        // Update totals
        document.getElementById("totalVisitors").textContent = totalViews;
        document.getElementById("totalViews").textContent = totalViews;

        // Fill Top Pages Table
        const topTable = document.getElementById("topPagesTable");
        topPages.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${getPageName(item.page)}</td><td>${item.count}</td>`;
            topTable.appendChild(row);
        });

        // Fill All Pages Table
        const allTable = document.getElementById("allPagesTable");
        allData.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${getPageName(item.page)}</td><td>${item.count}</td>`;
            allTable.appendChild(row);
        });
    }

    loadAnalytics();
</script>

</body>
</html>
