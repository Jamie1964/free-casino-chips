<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – FREE‑CASINO‑CHIPS.COM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family:Arial, sans-serif;
    background:#0d0d0d;
    color:#fff;
}
header {
    background:#111;
    padding:20px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
    border-bottom:2px solid #222;
}
.container {
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}
.card {
    background:#141414;
    padding:20px;
    border-radius:10px;
    border:1px solid #222;
    margin-bottom:25px;
}
table {
    width:100%;
    border-collapse:collapse;
}
th, td {
    padding:10px;
    border-bottom:1px solid #333;
}
th {
    background:#1c1c1c;
}
button {
    background:#66ccff;
    color:#000;
    padding:10px 18px;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
    margin-right:10px;
}
button:hover {
    background:#99ddff;
}
.dark-mode {
    background:#fff;
    color:#000;
}
.dark-mode .card {
    background:#f2f2f2;
    border-color:#ccc;
}
.dark-mode th {
    background:#e6e6e6;
}
</style>
</head>

<body>

<header>Admin Dashboard – FREE‑CASINO‑CHIPS.COM</header>

<div class="container">

<div style="margin-bottom:20px;">
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
    <button onclick="resetCounters()">Reset All Counters</button>
</div>

<script>
// ⭐ PAGE LIST (Home added)
const pages = [
"index","ace","americanluck","babacasino","bangcoins","cashoomo","casinoclick","chipnwin",
"cidercasino","coinsback","coinz","epicsweep","firesevens","fortunewheelz","funrize",
"funzcity","goldenheartsgames","goodvibes","hellomillions","high5casino","jumbo88",
"kingprize","lavishluck","legendz","lonestar","luckparty","luckyslots","luckystake",
"mcluck","modo","moozi","mrgoodwin","myprizeus","newluck","nolimitcoins","playfame",
"playtana","pulsz","rolla","scarletsands","sixty6","speedsweeps","spinblitz","spindoo",
"spinsagacasino","sportzino","spree","stormrush","sweepico","sweepsblast","sweepshark",
"taofortune","thewinzone","vegasway","winbonanza","wowvegas","yaycasino","zulacasino"
];

// ⭐ EXACT SIDEBAR NAMES
const sidebarNames = {
index:"Home", ace:"Ace", americanluck:"AmericanLuck", babacasino:"BabaCasino",
bangcoins:"BangCoins", cashoomo:"Cashoomo", casinoclick:"CasinoClick",
chipnwin:"ChipNWin", cidercasino:"CiderCasino", coinsback:"CoinsBackCasino",
coinz:"Coinz", epicsweep:"EpicSweep", firesevens:"FireSevens",
fortunewheelz:"FortuneWheelz", funrize:"Funrize", funzcity:"FunzCity",
goldenheartsgames:"GoldenHeartsGames", goodvibes:"GoodVibes",
hellomillions:"HelloMillions", high5casino:"High5Casino", jumbo88:"Jumbo88",
kingprize:"KingPrize", lavishluck:"LavishLuck", legendz:"Legendz",
lonestar:"LoneStar", luckparty:"LuckParty", luckyslots:"LuckySlots",
luckystake:"LuckyStake", mcluck:"McLuck", modo:"Modo", moozi:"Moozi",
mrgoodwin:"MrGoodwin", myprizeus:"MyPrizeUS", newluck:"NewLuck",
nolimitcoins:"NoLimitCoins", playfame:"PlayFame", playtana:"PlayTana",
pulsz:"Pulsz", rolla:"Rolla", scarletsands:"ScarletSands", sixty6:"Sixty6",
speedsweeps:"SpeedSweeps", spinblitz:"SpinBlitz", spindoo:"Spindoo",
spinsagacasino:"SpinSagaCasino", sportzino:"Sportzino", spree:"Spree",
stormrush:"StormRush", sweepico:"Sweepico", sweepsblast:"SweepsBlast",
sweepshark:"SweepsHark", taofortune:"TaoFortune", thewinzone:"TheWinZone",
vegasway:"VegasWay", winbonanza:"WinBonanza", wowvegas:"WowVegas",
yaycasino:"YayCasino", zulacasino:"ZulaCasino"
};

// ⭐ DATE HELPERS
function today() {
    return new Date().toISOString().slice(0,10);
}
function daysAgo(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d.toISOString().slice(0,10);
}

// ⭐ DAILY TRACKING
function incrementDaily(pageID) {
    const key = "views_" + pageID + "_" + today();
    let count = parseInt(localStorage.getItem(key) || "0");
    count++;
    localStorage.setItem(key, count);
}
// ⭐ GET DAILY TOTALS FOR A PAGE
function getDailyCount(pageID, date) {
    const key = "views_" + pageID + "_" + date;
    return parseInt(localStorage.getItem(key) || "0");
}

// ⭐ WEEKLY TOTALS (last 7 days)
function getWeeklyTotals() {
    let totals = {};
    pages.forEach(id => totals[id] = 0);

    for (let i = 0; i < 7; i++) {
        const d = daysAgo(i);
        pages.forEach(id => {
            totals[id] += getDailyCount(id, d);
        });
    }
    return totals;
}

// ⭐ MONTHLY TOTALS (last 30 days)
function getMonthlyTotals() {
    let totals = {};
    pages.forEach(id => totals[id] = 0);

    for (let i = 0; i < 30; i++) {
        const d = daysAgo(i);
        pages.forEach(id => {
            totals[id] += getDailyCount(id, d);
        });
    }
    return totals;
}

// ⭐ BUILD WEEKLY & MONTHLY TABLES
function buildPeriodTable(periodTotals, tableID) {
    const table = document.getElementById(tableID);

    const sorted = Object.entries(periodTotals)
        .sort((a,b)=>b[1]-a[1]);

    sorted.forEach(([id,count])=>{
        const row = document.createElement("tr");
        row.innerHTML = `<td>${sidebarNames[id]}</td><td>${count}</td>`;
        table.appendChild(row);
    });
}

// ⭐ MAIN ANALYTICS LOADER
function loadAnalytics() {
    let allData = [];
    let totalViews = 0;

    pages.forEach(id => {
        const key = "views_" + id;
        const count = parseInt(localStorage.getItem(key) || "0");
        allData.push({ id, count });
        totalViews += count;
    });

    document.getElementById("totalVisitors").textContent = totalViews;
    document.getElementById("totalViews").textContent = totalViews;

    // ⭐ TOP 10 TABLE
    const topPages = [...allData].sort((a,b)=>b.count-a.count).slice(0,10);
    const topTable = document.getElementById("topPagesTable");
    topPages.forEach(item=>{
        const row=document.createElement("tr");
        row.innerHTML=`<td>${sidebarNames[item.id]}</td><td>${item.count}</td>`;
        topTable.appendChild(row);
    });

    // ⭐ ALL PAGES TABLE
    const allTable = document.getElementById("allPagesTable");
    allData.forEach(item=>{
        const row=document.createElement("tr");
        row.innerHTML=`<td>${sidebarNames[item.id]}</td><td>${item.count}</td>`;
        allTable.appendChild(row);
    });

    // ⭐ WEEKLY TABLE
    const weeklyTotals = getWeeklyTotals();
    buildPeriodTable(weeklyTotals, "weeklyTable");

    // ⭐ MONTHLY TABLE
    const monthlyTotals = getMonthlyTotals();
    buildPeriodTable(monthlyTotals, "monthlyTable");

    // ⭐ CHARTS
    drawCharts(allData);
}

// ⭐ CHARTS
function drawCharts(data) {
    const labels = data.map(x=>x.id);
    const values = data.map(x=>x.count);

    new Chart(document.getElementById("barChart"), {
        type:"bar",
        data:{ labels, datasets:[{ label:"Views", data:values, backgroundColor:"#66ccff" }] },
        options:{ responsive:true, scales:{ y:{ beginAtZero:true } } }
    });

    new Chart(document.getElementById("pieChart"), {
        type:"pie",
        data:{ labels, datasets:[{ data:values, backgroundColor:labels.map(()=>randomColor()) }] },
        options:{ responsive:true }
    });
}

function randomColor() {
    return `hsl(${Math.random()*360},70%,60%)`;
}

// ⭐ DARK MODE
function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
}

// ⭐ RESET
function resetCounters() {
    if(!confirm("Reset ALL counters?")) return;

    // Remove main counters
    pages.forEach(id => localStorage.removeItem("views_" + id));

    // Remove daily counters
    Object.keys(localStorage).forEach(key=>{
        if(key.startsWith("views_") && key.split("_").length === 3) {
            localStorage.removeItem(key);
        }
    });

    location.reload();
}

loadAnalytics();
</script>

<!-- WEEKLY STATS -->
<div class="card">
    <h2>Weekly Stats (Last 7 Days)</h2>
    <table id="weeklyTable">
        <tr><th>Page</th><th>Views</th></tr>
    </table>
</div>

<!-- MONTHLY STATS -->
<div class="card">
    <h2>Monthly Stats (Last 30 Days)</h2>
    <table id="monthlyTable">
        <tr><th>Page</th><th>Views</th></tr>
    </table>
</div>

</div> <!-- END CONTAINER -->

</body>
</html>
