<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        background:#0d0d0d;
        color:#fff;
        font-family:Arial,Helvetica,sans-serif;
        margin:0;
        padding:20px;
    }
    .logo {
        width:80%;
        max-width:320px;
        display:block;
        margin:0 auto 20px;
        filter:drop-shadow(0 0 8px #000);
    }
    h1 {
        text-align:center;
        margin-bottom:20px;
        color:#66ccff;
        font-size:28px;
    }
    .page-row {
        display:flex;
        justify-content:space-between;
        align-items:center;
        background:#141414;
        padding:14px 18px;
        border-radius:8px;
        border:1px solid #222;
        margin-bottom:12px;
    }
    .page-button {
        background:#66ccff;
        color:#000;
        padding:10px 20px;
        border-radius:6px;
        font-weight:700;
        text-decoration:none;
        font-size:18px;
        box-shadow:0 0 10px #66ccff;
    }
    .view-count {
        font-size:18px;
        color:#ccc;
    }
</style>
</head>

<body>

<img src="images/site-logo.png" alt="Site Logo" class="logo">

<h1>Admin Panel</h1>

<div id="pageList"></div>

<script>
// Load sidebar.html and extract all links
async function loadPages() {
    try {
        const response = await fetch("sidebar.html");
        const html = await response.text();

        // Extract all .html links from sidebar
        const regex = /href="([^"]+\.html)"/g;
        let match;
        const pages = new Set();

        while ((match = regex.exec(html)) !== null) {
            const file = match[1];

            // Exclude amin.html itself
            if (file.toLowerCase() !== "amin.html") {
                pages.add(file);
            }
        }

        // Add index.html manually (not always in sidebar)
        pages.add("index.html");

        const sorted = Array.from(pages).sort();
        const container = document.getElementById("pageList");

        sorted.forEach(page => {
            const id = "views_" + page.replace(".html", "").replace(/-/g, "_");

            const row = document.createElement("div");
            row.className = "page-row";

            row.innerHTML = `
                <a href="${page}" target="_blank" class="page-button">${page.replace(".html","")}</a>
                <span class="view-count" id="${id}">0</span>
            `;

            container.appendChild(row);

            updateCount(id, id);
        });

    } catch (err) {
        document.getElementById("pageList").innerHTML =
            "<p style='color:#f66;'>Error loading page list.</p>";
    }
}

// LocalStorage counter loader
function updateCount(elementId, storageKey) {
    let count = parseInt(localStorage.getItem(storageKey) || "0");
    document.getElementById(elementId).textContent = count;
}

loadPages();
</script>

</body>
</html>
