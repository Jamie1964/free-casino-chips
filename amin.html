<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        background:#0d0d0d;
        color:#fff;
        font-family:Arial,Helvetica,sans-serif;
        margin:0;
        padding:20px;
    }
    h1 {
        text-align:center;
        margin-bottom:30px;
        color:#66ccff;
        font-size:32px;
    }
    .page-row {
        display:flex;
        justify-content:space-between;
        align-items:center;
        background:#141414;
        padding:14px 18px;
        border-radius:8px;
        border:1px solid #222;
        margin-bottom:12px;
    }
    .page-button {
        background:#66ccff;
        color:#000;
        padding:10px 20px;
        border-radius:6px;
        font-weight:700;
        text-decoration:none;
        font-size:18px;
        box-shadow:0 0 10px #66ccff;
    }
    .view-count {
        font-size:18px;
        color:#ccc;
    }
</style>
</head>

<body>

<h1>Admin Panel</h1>

<div id="pageList"></div>

<script>
// AUTO-DETECT ALL HTML FILES EXCEPT amin.html
async function loadPages() {
    try {
        const response = await fetch("/");
        const text = await response.text();

        // Extract .html files from directory listing
        const regex = /href="([^"]+\.html)"/g;
        let match;
        const pages = [];

        while ((match = regex.exec(text)) !== null) {
            const file = match[1];

            // Exclude amin.html itself
            if (file.toLowerCase() !== "amin.html") {
                pages.push(file);
            }
        }

        // Sort alphabetically for consistency
        pages.sort();

        const container = document.getElementById("pageList");

        pages.forEach(page => {
            const id = "views_" + page.replace(".html", "").replace(/-/g, "_");

            const row = document.createElement("div");
            row.className = "page-row";

            row.innerHTML = `
                <a href="${page}" target="_blank" class="page-button">${page.replace(".html","")}</a>
                <span class="view-count" id="${id}">0</span>
            `;

            container.appendChild(row);

            updateCount(id, id);
        });

    } catch (err) {
        document.getElementById("pageList").innerHTML =
            "<p style='color:#f66;'>Error loading page list.</p>";
    }
}

// LOCALSTORAGE COUNTER LOADER
function updateCount(elementId, storageKey) {
    let count = parseInt(localStorage.getItem(storageKey) || "0");
    document.getElementById(elementId).textContent = count;
}

loadPages();
</script>

</body>
</html>
