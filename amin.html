<!DOCTYPE html>

<meta charset="UTF-8">
<title>AMIN PANEL</title>

<style>
    body {
        background:#0d1117;
        color:white;
        font-family:Arial, sans-serif;
        margin:0;
        padding:25px;
    }

    h1 {
        text-align:center;
        color:#ffcc33;
        margin-bottom:25px;
        font-size:32px;
    }

    h2 {
        color:#66ccff;
        margin:25px 0 10px;
        font-size:22px;
    }

    /* GRID */
    .grid {
        display:grid;
        grid-template-columns:repeat(5, 1fr);
        gap:10px;
        margin-bottom:30px;
    }

    @media (max-width:1100px) {
        .grid {
            grid-template-columns:repeat(3, 1fr);
        }
    }

    /* BUTTONS */
    .btn {
        display:block;
        background:#0b1020;
        border:2px solid #66ccff;
        border-radius:8px;
        padding:10px 6px;
        text-decoration:none;
        color:#66ccff;
        font-weight:bold;
        font-size:14px;
        text-align:center;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
        box-shadow:0 0 6px #66ccff;
        transition:.25s;
    }

    .btn:hover {
        background:#111a33;
        box-shadow:0 0 12px #66ccff;
    }

    /* STATS BAR */
    .stats {
        background:#111a33;
        border:2px solid #ffcc33;
        padding:12px 15px;
        border-radius:10px;
        margin:10px 0 25px;
        font-size:18px;
        color:#ffcc33;
        display:flex;
        justify-content:space-between;
        max-width:900px;
        gap:12px;
        align-items:center;
    }

    .stats div { min-width:140px; text-align:center; }
</style>

<script>
function loadCounts() {
    let totalViews = 0;

    // Load button counts (all pages with data-page)
    const items = document.querySelectorAll("[data-page]");
    items.forEach(btn => {
        const page = btn.getAttribute("data-page");
        const count = parseInt(localStorage.getItem("views_" + page) || 0);
        btn.textContent = btn.getAttribute("data-name") + " — " + count;
        totalViews += count;
    });

    // Index views (explicit)
    const indexViews = parseInt(localStorage.getItem("views_index") || 0);
    document.getElementById("indexViews").textContent = indexViews;

    // Cheat views (explicit counter shown under Index Views)
    const cheatViews = parseInt(localStorage.getItem("views_cheat") || 0);
    document.getElementById("cheatViews").textContent = cheatViews;

    // Update totals (items loop already summed all pages including cheat and index)
    document.getElementById("totalViews").textContent = totalViews;
}

window.onload = loadCounts;
</script>
