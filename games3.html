<!-- PAGE VIEW COUNTER -->
<div style="text-align:center; margin-top:40px; font-size:18px; color:#ccc;">
    <span id="viewCount"></span>
</div>

<script>
    const pageId = "games";
    const countKey = "views_" + pageId;

    let views = localStorage.getItem(countKey);
    if (!views) {
        views = 1;
    } else {
        views = parseInt(views) + 1;
    }
    localStorage.setItem(countKey, views);

    document.getElementById("viewCount").innerText =
        "Page Views: " + views.toLocaleString();
</script>
